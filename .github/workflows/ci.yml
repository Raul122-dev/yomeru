name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked, with the typesetting stack)
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check --select F src tests scripts
      - name: Tests
        # goldens need captured runs and model weights: they live on the dev machine
        # (scripts/golden.py, scripts/analysis_golden.py) and their tests skip here
        run: uv run --no-sync pytest -q

  ui:
    name: UI (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
